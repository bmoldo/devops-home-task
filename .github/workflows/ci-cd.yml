name: Development Pipeline

on:
  push:
    branches: [ development ]
    paths:
      - 'app/**'
      - 'terraform/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'setup.py'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform-dev:
    name: Terraform Dev Infrastructure
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::070503547773:role/GitHubActionsRole
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Check for S3 state bucket
        id: check_s3_bucket
        run: |
          BUCKET_NAME="terraform-state-${{ github.repository_owner }}-${{ github.event.repository.name }}"
          BUCKET_EXISTS=$(aws s3api head-bucket --bucket $BUCKET_NAME 2>&1 || echo "not exists")
          if [[ $BUCKET_EXISTS == *"not exists"* ]]; then
            echo "create_bucket=true" >> $GITHUB_OUTPUT
            echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          else
            echo "create_bucket=false" >> $GITHUB_OUTPUT
            echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Create S3 state bucket if not exists
        if: steps.check_s3_bucket.outputs.create_bucket == 'true'
        run: |
          aws s3api create-bucket --bucket ${{ steps.check_s3_bucket.outputs.bucket_name }} --region us-east-1
          aws s3api put-bucket-versioning --bucket ${{ steps.check_s3_bucket.outputs.bucket_name }} --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption --bucket ${{ steps.check_s3_bucket.outputs.bucket_name }} --server-side-encryption-configuration '{"Rules": [{"ApplyServerSideEncryptionByDefault": {"SSEAlgorithm": "AES256"}}]}'

      - name: Update backend configuration
        run: |
          cat <<EOF > terraform/environments/dev/backend.tf
          terraform {
            backend "s3" {
              bucket = "${{ steps.check_s3_bucket.outputs.bucket_name }}"
              key    = "terraform/dev/terraform.tfstate"
              region = "us-east-1"
            }
          }
          EOF

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: terraform init

      - name: Terraform Format
        working-directory: terraform/environments/dev
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: terraform/environments/dev
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform/environments/dev
        id: plan
        run: |
          terraform plan -var-file=../../config/dev.tfvars -out=tfplan
          terraform show -json tfplan > plan.json

      - name: Store Plan Artifact
        uses: actions/upload-artifact@v3
        with:
          name: terraform-dev-plan
          path: terraform/environments/dev/plan.json
          retention-days: 5

      - name: Terraform Apply
        working-directory: terraform/environments/dev
        run: terraform apply -auto-approve tfplan

  test-app:
    name: Test Application
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: users
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      localstack:
        image: localstack/localstack:latest
        env:
          SERVICES: s3
          DEFAULT_REGION: us-east-1
        ports:
          - 4566:4566
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Initialize test database
        run: ./init-db.sh

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/users
          ENVIRONMENT: test
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          S3_BUCKET_NAME: user-queries
          AWS_ENDPOINT_URL: http://localhost:4566
          PYTEST_CURRENT_TEST: True
          AWS_SECURITY_TOKEN: testing
          AWS_SESSION_TOKEN: testing
        run: pytest --cov=app tests/ -v

  build-and-deploy-dev:
    name: Build and Deploy to Dev
    needs: [terraform-dev, test-app]
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::070503547773:role/GitHubActionsRole
          aws-region: us-east-1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Get ECR Repository Info
        id: get-ecr
        run: |
          ECR_REPO_NAME="user-api-dev"
          ECR_REPO=$(aws ecr describe-repositories --repository-names $ECR_REPO_NAME || echo "not exists")
          if [[ $ECR_REPO == *"not exists"* ]]; then
            echo "ECR repository does not exist. Check Terraform deployment."
            exit 1
          fi
          ECR_REPO_URI=$(aws ecr describe-repositories --repository-names $ECR_REPO_NAME --query 'repositories[0].repositoryUri' --output text)
          echo "ecr_repo_uri=$ECR_REPO_URI" >> $GITHUB_OUTPUT

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set image tags
        id: set-tags
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          echo "timestamp_tag=${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "git_sha_tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: |
            ${{ steps.get-ecr.outputs.ecr_repo_uri }}:${{ steps.set-tags.outputs.git_sha_tag }}
            ${{ steps.get-ecr.outputs.ecr_repo_uri }}:${{ steps.set-tags.outputs.timestamp_tag }}
            ${{ steps.get-ecr.outputs.ecr_repo_uri }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create deployment record
        run: |
          echo "{\"image\":\"${{ steps.get-ecr.outputs.ecr_repo_uri }}:${{ steps.set-tags.outputs.git_sha_tag }}\",\"timestamp\":\"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\",\"git_sha\":\"${{ github.sha }}\",\"git_ref\":\"${{ github.ref }}\"}" > deployment.json
          aws s3 cp deployment.json s3://user-queries-dev/deployments/${{ steps.set-tags.outputs.timestamp_tag }}.json

      - name: Update Lambda function with ECR image
        run: |
          LAMBDA_FUNCTION_NAME="user-api-dev"
          LAMBDA_EXISTS=$(aws lambda get-function --function-name $LAMBDA_FUNCTION_NAME 2>&1 || echo "not exists")
          if [[ $LAMBDA_EXISTS == *"not exists"* ]]; then
            echo "Lambda function doesn't exist. Please check Terraform output."
            exit 1
          fi
          aws lambda update-function-code --function-name $LAMBDA_FUNCTION_NAME --image-uri ${{ steps.get-ecr.outputs.ecr_repo_uri }}:${{ steps.set-tags.outputs.git_sha_tag }}

      - name: Update API Gateway
        run: |
          API_NAME="user-api-dev"
          API_ID=$(aws apigateway get-rest-apis --query "items[?name=='$API_NAME'].id" --output text)
          if [ -z "$API_ID" ]; then
            echo "API Gateway doesn't exist. Please check Terraform output."
            exit 1
          fi
          aws apigateway create-deployment --rest-api-id $API_ID --stage-name dev --description "Deployment from GitHub Actions - ${{ steps.set-tags.outputs.git_sha_tag }}"
