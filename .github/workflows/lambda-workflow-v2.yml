name: Lambda Build and Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      db_host:
        required: false
        type: string
        default: ""
      db_name:
        required: false
        type: string
        default: ""
    secrets:
      aws_role:
        required: true

jobs:
  build-lambda-package:
    name: Build Lambda Package
    runs-on: ubuntu-latest
    outputs:
      lambda_package_path: ${{ steps.create-lambda-package.outputs.lambda_package_path }}
      s3_lambda_key: ${{ steps.upload-lambda.outputs.s3_lambda_key }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Update script permissions
        run: |
          if [ -f create_lambda_package.sh ]; then
            chmod +x create_lambda_package.sh
          else
            echo "#!/bin/bash" > create_lambda_package.sh
            echo "echo 'Creating Lambda package...'" >> create_lambda_package.sh
            echo "mkdir -p lambda_package" >> create_lambda_package.sh
            echo "cp -r app/* lambda_package/" >> create_lambda_package.sh
            echo "pip install -r requirements.txt -t lambda_package/" >> create_lambda_package.sh
            echo "cd lambda_package" >> create_lambda_package.sh
            echo "zip -r ../lambda_deployment_package.zip ." >> create_lambda_package.sh
            echo "cd .." >> create_lambda_package.sh
            chmod +x create_lambda_package.sh
          fi

      - name: Create Lambda deployment package
        id: create-lambda-package
        run: |
          ./create_lambda_package.sh
          echo "lambda_package_path=lambda_deployment_package.zip" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials with Role
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.aws_role }}
          aws-region: us-east-1

      - name: Upload Lambda package to S3
        id: upload-lambda
        run: |
          ENVIRONMENT="${{ inputs.environment }}"
          ACCOUNT_ID="070503547773"
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          S3_KEY="lambda/lambda_deployment_package_${TIMESTAMP}.zip"
          S3_BUCKET="lambda-packages-${ENVIRONMENT}-${ACCOUNT_ID}"

          if ! aws s3api head-bucket --bucket $S3_BUCKET 2>/dev/null; then
            echo "Creating S3 bucket for Lambda packages: $S3_BUCKET"
            aws s3 mb s3://$S3_BUCKET --region us-east-1
          fi

          aws s3 cp lambda_deployment_package.zip s3://$S3_BUCKET/$S3_KEY
          if aws s3 ls s3://$S3_BUCKET/$S3_KEY; then
            echo "Lambda package uploaded successfully to s3://$S3_BUCKET/$S3_KEY"
            echo "s3_lambda_key=$S3_KEY" >> $GITHUB_OUTPUT
          else
            echo "Failed to upload Lambda package to S3"
            exit 1
          fi

  update-lambda:
    name: Update Lambda with New Package
    needs: [build-lambda-package]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials with Role
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.aws_role }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Setup AWS and Terraform
        uses: ./.github/actions/setup-aws-terraform
        id: setup
        with:
          aws-role: ${{ secrets.aws_role }}
          environment: ${{ inputs.environment }}

      - name: Create Lambda S3 variables file
        run: |
          ENVIRONMENT="${{ inputs.environment }}"
          ACCOUNT_ID="070503547773"
          S3_BUCKET="lambda-packages-${ENVIRONMENT}-${ACCOUNT_ID}"
          S3_KEY="${{ needs.build-lambda-package.outputs.s3_lambda_key }}"
          cat > terraform/environments/$ENVIRONMENT/lambda_vars.auto.tfvars <<EOF
          use_s3_source = true
          s3_bucket = "$S3_BUCKET"
          s3_key = "$S3_KEY"
          EOF

      - name: Create placeholder zip file
        run: |
          echo "Creating placeholder zip for Terraform"
          mkdir -p placeholder
          echo "placeholder" > placeholder/placeholder.txt
          cd placeholder
          zip -r ../lambda_deployment_package.zip .
          cd ..

      - name: Update backend configuration
        run: |
          ENVIRONMENT="${{ inputs.environment }}"
          cat <<EOF > terraform/environments/$ENVIRONMENT/backend.tf
          terraform {
            backend "s3" {
              bucket = "${{ steps.setup.outputs.s3-bucket-name }}"
              key    = "terraform/$ENVIRONMENT/terraform.tfstate"
              region = "us-east-1"
            }
          }
          EOF

      - name: Terraform Init
        run: |
          cd terraform/environments/${{ inputs.environment }}
          terraform init

      - name: Update Lambda Function
        run: |
          ENVIRONMENT="${{ inputs.environment }}"
          ACCOUNT_ID="070503547773"
          S3_BUCKET="lambda-packages-${ENVIRONMENT}-${ACCOUNT_ID}"
          S3_KEY="${{ needs.build-lambda-package.outputs.s3_lambda_key }}"

          cd terraform/environments/$ENVIRONMENT
          LAMBDA_FUNCTION_NAME=$(terraform output -raw lambda_function_name 2>/dev/null || echo "")

          if [ -z "$LAMBDA_FUNCTION_NAME" ]; then
            echo "Warning: Could not find Lambda function name in Terraform outputs"
            echo "Continuing to apply Terraform..."
            terraform apply -auto-approve \
              -var="s3_bucket=$S3_BUCKET" \
              -var="s3_key=$S3_KEY" \
              -var="lambda_zip_path=../../../lambda_deployment_package.zip"
          else
            echo "Found Lambda function: $LAMBDA_FUNCTION_NAME"
            echo "Updating Lambda code directly via AWS CLI"

            aws lambda update-function-code \
              --function-name $LAMBDA_FUNCTION_NAME \
              --s3-bucket $S3_BUCKET \
              --s3-key $S3_KEY \
              --publish

            if [ -n "${{ inputs.db_host }}" ] || [ -n "${{ inputs.db_name }}" ]; then
              echo "Updating Lambda environment variables"
              aws lambda update-function-configuration \
                --function-name $LAMBDA_FUNCTION_NAME \
                --environment "Variables={DB_HOST=${{ inputs.db_host }},DB_NAME=${{ inputs.db_name }}}"
            fi
          fi
