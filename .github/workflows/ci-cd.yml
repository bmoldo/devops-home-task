name: Unified Deployment Pipeline

on:
  push:
    paths:
      - 'terraform/**'
      - 'app/**'
      - 'Dockerfile'
      - 'docker-compose.yml'

jobs:
  # Terraform Jobs
  terraform_plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Check/Create S3 State File
        run: |
          STATE_BUCKET="${{ secrets.S3_STATE_BUCKET }}"
          STATE_KEY="dev.tfstate"
          if aws s3 ls s3://$STATE_BUCKET/$STATE_KEY; then
            echo "State file exists."
          else
            echo "State file not found. Creating a placeholder."
            echo "{}" > empty.tfstate
            aws s3 cp empty.tfstate s3://$STATE_BUCKET/$STATE_KEY
          fi

      - name: Initialize Terraform
        working-directory: terraform/environments/dev
        run: terraform init -backend-config="bucket=${{ secrets.S3_STATE_BUCKET }}" -backend-config="key=dev.tfstate"

      - name: Terraform Plan
        working-directory: terraform/environments/dev
        run: terraform plan -var-file=../../config/dev.tfvars

  terraform_apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform_plan
    # If the push is to the production branch, use the production environment (which should be configured with required reviewers)
    environment: ${{ github.ref == 'refs/heads/production' ? 'production' : 'development' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Initialize Terraform
        working-directory: terraform/environments/dev
        run: terraform init -backend-config="bucket=${{ secrets.S3_STATE_BUCKET }}" -backend-config="key=dev.tfstate"

      - name: Terraform Apply
        working-directory: terraform/environments/dev
        run: terraform apply -auto-approve -var-file=../../config/dev.tfvars

  # Application Jobs
  app_build:
    name: Build & Package App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build Docker Image
        run: docker build -t my-app:${{ github.sha }} .

      - name: Tag and Push Image to ECR
        run: |
          ECR_REPO=${{ secrets.ECR_REPOSITORY }}
          docker tag my-app:${{ github.sha }} ${ECR_REPO}:latest
          docker push ${ECR_REPO}:latest

      - name: Create Lambda Package
        run: bash create_lambda_package.sh

      - name: Upload Lambda Package Artifact
        uses: actions/upload-artifact@v3
        with:
          name: lambda-package
          path: lambda-package.zip

  app_deploy:
    name: Deploy App
    runs-on: ubuntu-latest
    needs: app_build
    # Use the production environment for production branch, triggering any required approval, otherwise use development.
    environment: ${{ github.ref == 'refs/heads/production' ? 'production' : 'development' }}
    steps:
      - name: Download Lambda Package Artifact
        uses: actions/download-artifact@v3
        with:
          name: lambda-package

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update Lambda Function Code
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://lambda-package.zip

      - name: Deploy API Gateway
        run: |
          aws apigateway create-deployment \
            --rest-api-id ${{ secrets.API_GATEWAY_ID }} \
            --stage-name ${{ secrets.API_STAGE_NAME }}
