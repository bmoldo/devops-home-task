name: Destroy Infrastructure

on:
  push:
    branches:
      - main
      - development

permissions:
  contents: read
  id-token: write

jobs:
  terraform-destroy:
    name: Terraform Destroy Infrastructure
    runs-on: ubuntu-latest
    environment: 'dev'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials with Role
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::070503547773:role/GitHubActionsRole
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Create placeholder zip for destroy
        run: |
          echo "Creating placeholder Lambda ZIP for destroy operation"
          mkdir -p placeholder
          echo "placeholder" > placeholder/placeholder.txt
          cd placeholder
          zip -r ../lambda_deployment_package.zip .
          cd ..

      - name: Check for S3 state bucket
        id: check_s3_bucket
        run: |
          BUCKET_NAME="terraform-state-${{ github.repository_owner }}-${{ github.event.repository.name }}"
          BUCKET_EXISTS=$(aws s3api head-bucket --bucket $BUCKET_NAME 2>&1 || echo "not exists")
          if [[ $BUCKET_EXISTS == *"not exists"* ]]; then
            echo "create_bucket=true" >> $GITHUB_OUTPUT
            echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          else
            echo "create_bucket=false" >> $GITHUB_OUTPUT
            echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Set TFVARS file path
        id: set-tfvars
        run: |
          ENVIRONMENT="dev"
          TFVARS_FILE="../config/${ENVIRONMENT}.tfvars"
          
          # Check if the tfvars file exists at the expected path
          if [ ! -f "terraform/environments/$ENVIRONMENT/$TFVARS_FILE" ]; then
            echo "TFVARS file not found at terraform/environments/$ENVIRONMENT/$TFVARS_FILE"
            echo "Checking for alternative locations..."
            
            # Look for tfvars files in common locations
            ALTERNATIVE_PATHS=(
              "terraform/config/${ENVIRONMENT}.tfvars"
              "config/${ENVIRONMENT}.tfvars"
              "terraform/environments/$ENVIRONMENT/${ENVIRONMENT}.tfvars"
            )
            
            for ALT_PATH in "${ALTERNATIVE_PATHS[@]}"; do
              if [ -f "$ALT_PATH" ]; then
                echo "Found tfvars file at $ALT_PATH"
                TFVARS_FILE="$ALT_PATH"
                break
              fi
            done
          fi
          
          echo "tfvars_file=$TFVARS_FILE" >> $GITHUB_OUTPUT
          echo "Selected environment: $ENVIRONMENT"
          echo "Selected tfvars file: $TFVARS_FILE"
          
          # Debug - Show directory structure for troubleshooting
          echo "Directory structure:"
          find terraform -type f -name "*.tfvars" | sort

      - name: Update backend configuration
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment }}"
          cat <<EOF > terraform/environments/$ENVIRONMENT/backend.tf
          terraform {
            backend "s3" {
              bucket = "${{ steps.check_s3_bucket.outputs.bucket_name }}"
              key    = "terraform/$ENVIRONMENT/terraform.tfstate"
              region = "us-east-1"
            }
          }
          EOF

      - name: Terraform Init
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment }}"
          cd terraform/environments/$ENVIRONMENT
          terraform init

      - name: Terraform Destroy Plan
        id: plan
        run: |
          ENVIRONMENT="dev"
          TFVARS_FILE="${{ steps.set-tfvars.outputs.tfvars_file }}"
          
          cd terraform/environments/$ENVIRONMENT
          
          # Check if tfvars file exists before using it
          if [ -f "$TFVARS_FILE" ]; then
            terraform plan -destroy -var-file=$TFVARS_FILE -var="lambda_zip_path=../../../lambda_deployment_package.zip" -out=destroy.tfplan
          else
            echo "Warning: TFVARS file not found. Running without var-file..."
            terraform plan -destroy -var="lambda_zip_path=../../../lambda_deployment_package.zip" -out=destroy.tfplan
          fi
          
          terraform show -no-color destroy.tfplan > destroy_plan.txt

      - name: Display Destroy Plan
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment }}"
          cat terraform/environments/$ENVIRONMENT/destroy_plan.txt

      - name: Terraform Destroy
        run: |
          ENVIRONMENT="dev"
          TFVARS_FILE="${{ steps.set-tfvars.outputs.tfvars_file }}"
          
          cd terraform/environments/$ENVIRONMENT
          echo "Proceeding with destruction of $ENVIRONMENT environment..."
          
          # Check if tfvars file exists before using it
          if [ -f "$TFVARS_FILE" ]; then
            terraform destroy -auto-approve -var-file=$TFVARS_FILE -var="lambda_zip_path=../../../lambda_deployment_package.zip"
          else
            echo "Warning: TFVARS file not found. Running without var-file..."
            terraform destroy -auto-approve -var="lambda_zip_path=../../../lambda_deployment_package.zip"
          fi