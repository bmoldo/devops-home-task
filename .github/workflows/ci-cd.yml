name: Infrastructure Pipeline

on:
  push:
    branches: [ development, qa ]
    paths:
      - 'app/**'
      - 'terraform/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'setup.py'
      - '.github/workflows/ci-cd.yml'
      - 'lambda_handler.py'
      - 'create_lambda_package.sh'
  pull_request:
    branches: [ main ]
    types: [ closed ]
    paths:
      - 'app/**'
      - 'terraform/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'setup.py'
      - '.github/workflows/ci-cd.yml'
      - 'lambda_handler.py'
      - 'create_lambda_package.sh'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - prod
      run_infrastructure:
        description: 'Run Terraform Infrastructure'
        required: true
        default: true
        type: boolean
      run_tests:
        description: 'Run Tests'
        required: true
        default: true
        type: boolean
      build_and_deploy:
        description: 'Build and Deploy'
        required: true
        default: true
        type: boolean
      destroy_infrastructure:
        description: 'Destroy Infrastructure'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  determine-environment:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      tfvars_file: ${{ steps.set-env.outputs.tfvars_file }}
    steps:
      - name: Set environment based on branch, PR or input
        id: set-env
        run: |
          # Default to dev
          ENVIRONMENT="dev"
          TFVARS_FILE="../../config/${ENVIRONMENT}.tfvars"
          
          # If workflow_dispatch, use the input
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENVIRONMENT="${{ github.event.inputs.environment }}"
            TFVARS_FILE="../../config/${ENVIRONMENT}.tfvars"
          # For pull request to main that's merged, use prod
          elif [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.merged }}" == "true" && "${{ github.base_ref }}" == "main" ]]; then
            ENVIRONMENT="prod"
            TFVARS_FILE="../../config/prod.tfvars"
          # Otherwise determine from branch
          elif [[ "${{ github.ref }}" == "refs/heads/qa" ]]; then
            ENVIRONMENT="qa"
            TFVARS_FILE="../../config/qa.tfvars"
          fi
          
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "tfvars_file=$TFVARS_FILE" >> $GITHUB_OUTPUT
          echo "Selected environment: $ENVIRONMENT"
          echo "Selected tfvars file: $TFVARS_FILE"

      - name: Configure AWS credentials with Role
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::070503547773:role/GitHubActionsRole
          aws-region: us-east-1

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Check for file changes
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            terraform:
              - 'terraform/**'
            app:
              - 'app/**'
              - 'Dockerfile'
              - 'requirements.txt'
              - 'setup.py'
              - 'lambda_handler.py'
              - 'create_lambda_package.sh'

  terraform-plan:
    name: Terraform Plan
    needs: [determine-environment, changes]
    # Run for all branches, including PRs to main
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.run_infrastructure == 'true' && github.event.inputs.destroy_infrastructure == 'false') || (github.event_name != 'workflow_dispatch' && needs.changes.outputs.terraform == 'true') }}
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-environment.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials with Role
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::070503547773:role/GitHubActionsRole
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Check for S3 state bucket
        id: check_s3_bucket
        run: |
          BUCKET_NAME="terraform-state-${{ github.repository_owner }}-${{ github.event.repository.name }}"
          BUCKET_EXISTS=$(aws s3api head-bucket --bucket $BUCKET_NAME 2>&1 || echo "not exists")
          if [[ $BUCKET_EXISTS == *"not exists"* ]]; then
            echo "create_bucket=true" >> $GITHUB_OUTPUT
            echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          else
            echo "create_bucket=false" >> $GITHUB_OUTPUT
            echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Create S3 state bucket if not exists
        if: steps.check_s3_bucket.outputs.create_bucket == 'true'
        run: |
          aws s3api create-bucket --bucket ${{ steps.check_s3_bucket.outputs.bucket_name }} --region us-east-1
          aws s3api put-bucket-versioning --bucket ${{ steps.check_s3_bucket.outputs.bucket_name }} --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption --bucket ${{ steps.check_s3_bucket.outputs.bucket_name }} --server-side-encryption-configuration '{"Rules": [{"ApplyServerSideEncryptionByDefault": {"SSEAlgorithm": "AES256"}}]}'

      - name: Create valid placeholder Lambda ZIP
        run: |
          echo "Creating valid placeholder Lambda ZIP for planning"
          mkdir -p placeholder_lambda
          echo 'def lambda_handler(event, context): return {"statusCode": 200, "body": "Placeholder Lambda function"}' > placeholder_lambda/lambda_handler.py
          cd placeholder_lambda
          zip -r ../lambda_deployment_package.zip .
          cd ..

      - name: Update backend configuration
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          cat <<EOF > terraform/environments/$ENVIRONMENT/backend.tf
          terraform {
            backend "s3" {
              bucket = "${{ steps.check_s3_bucket.outputs.bucket_name }}"
              key    = "terraform/$ENVIRONMENT/terraform.tfstate"
              region = "us-east-1"
            }
          }
          EOF

      - name: Terraform Init
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          cd terraform/environments/$ENVIRONMENT
          terraform init

      - name: Terraform Format
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          cd terraform/environments/$ENVIRONMENT
          terraform fmt -check -recursive

      - name: Terraform Validate
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          cd terraform/environments/$ENVIRONMENT
          terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          TFVARS_FILE="${{ needs.determine-environment.outputs.tfvars_file }}"
          
          cd terraform/environments/$ENVIRONMENT
          terraform plan -var-file=$TFVARS_FILE -var="lambda_zip_path=../../../lambda_deployment_package.zip" -out=tfplan
          terraform show -json tfplan > plan.json
      
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-${{ needs.determine-environment.outputs.environment }}-plan
          path: terraform/environments/${{ needs.determine-environment.outputs.environment }}/plan.json
          retention-days: 5
          
      - name: Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const environment = '${{ needs.determine-environment.outputs.environment }}';
            const planSummary = fs.readFileSync('terraform/environments/' + environment + '/tfplan', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan for ${environment} environment\n\n` +
                    `\`\`\`\n${planSummary}\n\`\`\``
            });

  terraform-apply:
    name: Terraform Apply Infrastructure
    needs: [determine-environment, terraform-plan]
    # Only run apply on:
    # 1. Direct pushes to development/qa branches
    # 2. Approved and merged PRs to main
    # 3. Manual workflow runs
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_infrastructure == 'true') ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/qa')) || 
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.base_ref == 'main')
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-environment.outputs.environment }}
    outputs:
      db_host: ${{ steps.outputs.outputs.db_host }}
      db_name: ${{ steps.outputs.outputs.db_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials with Role
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::070503547773:role/GitHubActionsRole
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Check for S3 state bucket
        id: check_s3_bucket
        run: |
          BUCKET_NAME="terraform-state-${{ github.repository_owner }}-${{ github.event.repository.name }}"
          BUCKET_EXISTS=$(aws s3api head-bucket --bucket $BUCKET_NAME 2>&1 || echo "not exists")
          if [[ $BUCKET_EXISTS == *"not exists"* ]]; then
            echo "create_bucket=true" >> $GITHUB_OUTPUT
            echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          else
            echo "create_bucket=false" >> $GITHUB_OUTPUT
            echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Create valid placeholder Lambda ZIP
        run: |
          echo "Creating valid placeholder Lambda ZIP for deployment"
          mkdir -p placeholder_lambda
          echo 'def lambda_handler(event, context): return {"statusCode": 200, "body": "Placeholder Lambda function"}' > placeholder_lambda/lambda_handler.py
          cd placeholder_lambda
          zip -r ../lambda_deployment_package.zip .
          cd ..

      - name: Update backend configuration
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          cat <<EOF > terraform/environments/$ENVIRONMENT/backend.tf
          terraform {
            backend "s3" {
              bucket = "${{ steps.check_s3_bucket.outputs.bucket_name }}"
              key    = "terraform/$ENVIRONMENT/terraform.tfstate"
              region = "us-east-1"
            }
          }
          EOF

      - name: Terraform Init
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          cd terraform/environments/$ENVIRONMENT
          terraform init

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-${{ needs.determine-environment.outputs.environment }}-plan
          path: terraform/environments/${{ needs.determine-environment.outputs.environment }}/

      - name: Terraform Apply
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          TFVARS_FILE="${{ needs.determine-environment.outputs.tfvars_file }}"
          
          cd terraform/environments/$ENVIRONMENT
          terraform apply -auto-approve -var-file=$TFVARS_FILE -var="lambda_zip_path=../../../lambda_deployment_package.zip"
        
      - name: Get Terraform Outputs
        id: outputs
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          cd terraform/environments/$ENVIRONMENT
          
          # Save the outputs to a file first
          terraform output > terraform_outputs.txt
          
          # Process the file safely
          if grep -q "rds_endpoint" terraform_outputs.txt; then
            DB_HOST=$(terraform output -raw rds_endpoint 2>/dev/null | tr -d '\n')
          else
            echo "Warning: rds_endpoint output not found, using empty value"
            DB_HOST=""
          fi
          
          if grep -q "db_name" terraform_outputs.txt; then
            DB_NAME=$(terraform output -raw db_name 2>/dev/null | tr -d '\n')
          else
            echo "Warning: db_name output not found, using empty value"
            DB_NAME=""
          fi
          
          echo "db_host=${DB_HOST}" >> $GITHUB_OUTPUT
          echo "db_name=${DB_NAME}" >> $GITHUB_OUTPUT

  build-lambda-package:
    name: Build Lambda Package
    needs: [determine-environment, changes]
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_and_deploy == 'true' && github.event.inputs.destroy_infrastructure == 'false') || (github.event_name != 'workflow_dispatch' && needs.changes.outputs.app == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      lambda_package_path: ${{ steps.create-lambda-package.outputs.lambda_package_path }}
      s3_lambda_key: ${{ steps.upload-lambda.outputs.s3_lambda_key }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Update script permissions
        run: chmod +x create_lambda_package.sh

      - name: Create Lambda deployment package
        id: create-lambda-package
        run: |
          ./create_lambda_package.sh
          echo "lambda_package_path=lambda_deployment_package.zip" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials with Role
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::070503547773:role/GitHubActionsRole
          aws-region: us-east-1

      - name: Upload Lambda package to S3
        id: upload-lambda
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          ACCOUNT_ID="070503547773"
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          S3_KEY="lambda/lambda_deployment_package_${TIMESTAMP}.zip"
          S3_BUCKET="lambda-packages-${ENVIRONMENT}-${ACCOUNT_ID}"
          
          # Check if bucket exists (should be created by Terraform)
          if ! aws s3api head-bucket --bucket $S3_BUCKET 2>/dev/null; then
            echo "Error: Lambda zip bucket doesn't exist. Infrastructure may not be deployed yet."
            exit 1
          fi
          
          # Upload to S3
          aws s3 cp lambda_deployment_package.zip s3://$S3_BUCKET/$S3_KEY
          
          # Verify upload
          if aws s3 ls s3://$S3_BUCKET/$S3_KEY; then
            echo "Lambda package uploaded successfully to s3://$S3_BUCKET/$S3_KEY"
            echo "s3_lambda_key=$S3_KEY" >> $GITHUB_OUTPUT
          else
            echo "Failed to upload Lambda package to S3"
            exit 1
          fi

  update-lambda:
    name: Update Lambda with New Package
    needs: [determine-environment, build-lambda-package, terraform-apply]
    # Only run on the same conditions as terraform-apply, plus requiring app changes
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_and_deploy == 'true') ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/qa') && needs.changes.outputs.app == 'true') || 
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.base_ref == 'main' && needs.changes.outputs.app == 'true')
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-environment.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials with Role
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::070503547773:role/GitHubActionsRole
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Check for S3 state bucket
        id: check_s3_bucket
        run: |
          BUCKET_NAME="terraform-state-${{ github.repository_owner }}-${{ github.event.repository.name }}"
          BUCKET_EXISTS=$(aws s3api head-bucket --bucket $BUCKET_NAME 2>&1 || echo "not exists")
          if [[ $BUCKET_EXISTS == *"not exists"* ]]; then
            echo "create_bucket=true" >> $GITHUB_OUTPUT
            echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          else
            echo "create_bucket=false" >> $GITHUB_OUTPUT
            echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Create Lambda S3 variables file
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          ACCOUNT_ID="070503547773"
          S3_BUCKET="lambda-packages-${ENVIRONMENT}-${ACCOUNT_ID}"
          S3_KEY="${{ needs.build-lambda-package.outputs.s3_lambda_key }}"
          
          cat > terraform/environments/$ENVIRONMENT/lambda_vars.auto.tfvars <<EOF
          use_s3_source = true
          s3_bucket = "$S3_BUCKET"
          s3_key = "$S3_KEY"
          EOF
          
          echo "Created lambda_vars.auto.tfvars:"
          cat terraform/environments/$ENVIRONMENT/lambda_vars.auto.tfvars

      - name: Create placeholder zip file
        run: |
          echo "Creating placeholder zip for Terraform"
          mkdir -p placeholder
          echo "placeholder" > placeholder/placeholder.txt
          cd placeholder
          zip -r ../lambda_deployment_package.zip .
          cd ..

      - name: Update backend configuration
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          cat <<EOF > terraform/environments/$ENVIRONMENT/backend.tf
          terraform {
            backend "s3" {
              bucket = "${{ steps.check_s3_bucket.outputs.bucket_name }}"
              key    = "terraform/$ENVIRONMENT/terraform.tfstate"
              region = "us-east-1"
            }
          }
          EOF

      - name: Terraform Init
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          cd terraform/environments/$ENVIRONMENT
          terraform init

      - name: Terraform Apply with Lambda package
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          ACCOUNT_ID="070503547773"
          TFVARS_FILE="${{ needs.determine-environment.outputs.tfvars_file }}"
          S3_BUCKET="lambda-packages-${ENVIRONMENT}-${ACCOUNT_ID}"
          S3_KEY="${{ needs.build-lambda-package.outputs.s3_lambda_key }}"
          
          cd terraform/environments/$ENVIRONMENT
          terraform apply -auto-approve \
            -var-file=$TFVARS_FILE \
            -var="use_s3_source=true" \
            -var="s3_bucket=$S3_BUCKET" \
            -var="s3_key=$S3_KEY" \
            -var="lambda_zip_path=../../../lambda_deployment_package.zip"

  test-app:
    name: Test Application
    needs: [determine-environment, terraform-apply, update-lambda]
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.run_tests == 'true' && github.event.inputs.destroy_infrastructure == 'false') || (github.event_name != 'workflow_dispatch' && needs.changes.outputs.app == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::070503547773:role/GitHubActionsRole
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Get Lambda and S3 details
        id: get-aws-resources
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          
          # Default values if Terraform outputs cannot be retrieved
          LAMBDA_FUNCTION_NAME="user-api-${ENVIRONMENT}"
          LAMBDA_FUNCTION_ARN="arn:aws:lambda:us-east-1:070503547773:function:user-api-${ENVIRONMENT}"
          S3_BUCKET_NAME="user-api-${ENVIRONMENT}"
          
          # Try to get values from Terraform only if state is accessible
          cd terraform/environments/$ENVIRONMENT
          if terraform init -backend=true -reconfigure >/dev/null 2>&1; then
            echo "Terraform initialized successfully, retrieving outputs..."
            
            # Get Lambda function name if available
            TF_LAMBDA_NAME=$(terraform output -json | jq -r '.lambda_function_name.value // empty' 2>/dev/null)
            if [ ! -z "$TF_LAMBDA_NAME" ]; then
              LAMBDA_FUNCTION_NAME="$TF_LAMBDA_NAME"
            fi
            
            # Get Lambda function ARN if available
            TF_LAMBDA_ARN=$(terraform output -json | jq -r '.lambda_function_arn.value // empty' 2>/dev/null)
            if [ ! -z "$TF_LAMBDA_ARN" ]; then
              LAMBDA_FUNCTION_ARN="$TF_LAMBDA_ARN"
            fi
            
            # Get S3 bucket name if available
            TF_S3_BUCKET=$(terraform output -json | jq -r '.s3_bucket_name.value // empty' 2>/dev/null)
            if [ ! -z "$TF_S3_BUCKET" ]; then
              S3_BUCKET_NAME="$TF_S3_BUCKET"
            fi
          else
            echo "Could not initialize Terraform, using default values"
          fi
          
          # Output the values
          echo "lambda_function_name=$LAMBDA_FUNCTION_NAME" >> $GITHUB_OUTPUT
          echo "lambda_function_arn=$LAMBDA_FUNCTION_ARN" >> $GITHUB_OUTPUT
          echo "s3_bucket_name=$S3_BUCKET_NAME" >> $GITHUB_OUTPUT
          
          echo "Using Lambda function name: $LAMBDA_FUNCTION_NAME"
          echo "Using Lambda function ARN: $LAMBDA_FUNCTION_ARN"
          echo "Using S3 bucket name: $S3_BUCKET_NAME"

      - name: Get database credentials from Secrets Manager
        id: get-db-creds
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          
          # Hardcoded secret ARN pattern
          SECRET_ARN="arn:aws:secretsmanager:us-east-1:070503547773:secret:user-api-${ENVIRONMENT}-credentials-Eg89Zg"
          
          echo "Using secret ARN: $SECRET_ARN"
          
          # Get and parse secret value
          SECRET_VALUE=$(aws secretsmanager get-secret-value --secret-id $SECRET_ARN --query SecretString --output text)
          
          if [ -z "$SECRET_VALUE" ]; then
            echo "Error: Could not retrieve secret value from $SECRET_ARN"
            exit 1
          fi
          
          # Extract values
          DB_HOST=$(echo $SECRET_VALUE | jq -r '.host // empty')
          DB_USER=$(echo $SECRET_VALUE | jq -r '.username // empty')  
          DB_PASS=$(echo $SECRET_VALUE | jq -r '.password // empty')
          DB_NAME=$(echo $SECRET_VALUE | jq -r '.dbname // empty')
          DB_PORT=$(echo $SECRET_VALUE | jq -r '.port // empty')
          
          # Validate critical values
          if [ -z "$DB_HOST" ] || [ -z "$DB_USER" ] || [ -z "$DB_PASS" ]; then
            echo "Error: Missing critical database credentials"
            exit 1
          fi
          
          # Output values
          echo "DB_HOST=$DB_HOST" >> $GITHUB_OUTPUT
          echo "DB_USER=$DB_USER" >> $GITHUB_OUTPUT
          echo "DB_PASS=$DB_PASS" >> $GITHUB_OUTPUT
          echo "DB_NAME=$DB_NAME" >> $GITHUB_OUTPUT 
          echo "DB_PORT=$DB_PORT" >> $GITHUB_OUTPUT
          
          echo "Successfully retrieved database credentials for $DB_HOST"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov boto3 moto jq

      - name: Run Lambda tests
        env:
          # Database configuration using RDS credentials
          DATABASE_URL: postgresql://${{ steps.get-db-creds.outputs.DB_USER }}:${{ steps.get-db-creds.outputs.DB_PASS }}@${{ steps.get-db-creds.outputs.DB_HOST }}:${{ steps.get-db-creds.outputs.DB_PORT }}/${{ steps.get-db-creds.outputs.DB_NAME }}
          
          # AWS Lambda configuration
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          AWS_EXECUTION_ENV: AWS_Lambda_python3.11
          AWS_LAMBDA_FUNCTION_NAME: ${{ steps.get-aws-resources.outputs.lambda_function_name }}
          LAMBDA_FUNCTION_ARN: ${{ steps.get-aws-resources.outputs.lambda_function_arn }}
          
          # Environment & testing configuration
          ENVIRONMENT: ${{ needs.determine-environment.outputs.environment }}
          PYTEST_CURRENT_TEST: "True"
          S3_BUCKET_NAME: ${{ steps.get-aws-resources.outputs.s3_bucket_name }}
        run: |
          echo "Running Lambda tests with the following configuration:"
          echo "DATABASE_URL: $(echo $DATABASE_URL | sed 's/:.*)@/:***@/')"  # Mask password in logs
          echo "AWS_LAMBDA_FUNCTION_NAME: $AWS_LAMBDA_FUNCTION_NAME"
          echo "LAMBDA_FUNCTION_ARN: $LAMBDA_FUNCTION_ARN"
          echo "S3_BUCKET_NAME: $S3_BUCKET_NAME"
          echo "ENVIRONMENT: $ENVIRONMENT"
          
          # Run only the Lambda tests with coverage reporting
          pytest tests/test_lambda.py -v --cov=app --cov-report=xml --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ needs.determine-environment.outputs.environment }}
          path: |
            coverage.xml
            test-results.xml
          retention-days: 5

      - name: Analyze test results
        if: always()
        run: |
          if [ -f test-results.xml ]; then
            TEST_FAILURES=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('test-results.xml'); root = tree.getroot(); print(int(root.attrib.get('failures', 0)) + int(root.attrib.get('errors', 0)))")
            echo "Test failures/errors: $TEST_FAILURES"
            
            if [ "$TEST_FAILURES" -gt 0 ]; then
              echo "::error::Tests failed with $TEST_FAILURES failures/errors"
              exit 1
            else
              echo "All tests passed successfully!"
            fi
          else
            echo "::warning::No test results found"
          fi

      - name: Report test coverage
        if: always() && success()
        run: |
          if [ -f coverage.xml ]; then
            COVERAGE=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(float(root.attrib.get('line-rate', 0)) * 100)")
            echo "Test coverage: $COVERAGE%"
            
            if (( $(echo "$COVERAGE < 70" | bc -l) )); then
              echo "::warning::Test coverage is below 70%: $COVERAGE%"
            else
              echo "Test coverage meets the requirement: $COVERAGE%"
            fi
          else
            echo "::warning::No coverage report found"
          fi

      - name: Notify on test completion
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            const { issue, repo } = context;
            const status = '${{ job.status }}' === 'success' ? '✅ Passed' : '❌ Failed';
            
            if (context.payload.pull_request) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## Test Results for ${{ needs.determine-environment.outputs.environment }} environment: ${status}\n\nSee details in the [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`
              });
            }

  terraform-destroy:
    name: Terraform Destroy Infrastructure
    needs: [determine-environment]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.destroy_infrastructure == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-environment.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials with Role
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::070503547773:role/GitHubActionsRole
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Create placeholder zip for destroy
        run: |
          echo "Creating placeholder Lambda ZIP for destroy operation"
          mkdir -p placeholder
          echo "placeholder" > placeholder/placeholder.txt
          cd placeholder
          zip -r ../lambda_deployment_package.zip .
          cd ..

      - name: Check for S3 state bucket
        id: check_s3_bucket
        run: |
          BUCKET_NAME="terraform-state-${{ github.repository_owner }}-${{ github.event.repository.name }}"
          BUCKET_EXISTS=$(aws s3api head-bucket --bucket $BUCKET_NAME 2>&1 || echo "not exists")
          if [[ $BUCKET_EXISTS == *"not exists"* ]]; then
            echo "create_bucket=true" >> $GITHUB_OUTPUT
            echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          else
            echo "create_bucket=false" >> $GITHUB_OUTPUT
            echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Update backend configuration
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          cat <<EOF > terraform/environments/$ENVIRONMENT/backend.tf
          terraform {
            backend "s3" {
              bucket = "${{ steps.check_s3_bucket.outputs.bucket_name }}"
              key    = "terraform/$ENVIRONMENT/terraform.tfstate"
              region = "us-east-1"
            }
          }
          EOF

      - name: Terraform Init
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          cd terraform/environments/$ENVIRONMENT
          terraform init

      - name: Terraform Destroy Plan
        id: destroy-plan
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          TFVARS_FILE="${{ needs.determine-environment.outputs.tfvars_file }}"
          
          cd terraform/environments/$ENVIRONMENT
          terraform plan -destroy -var-file=$TFVARS_FILE -var="lambda_zip_path=../../../lambda_deployment_package.zip" -out=destroy.tfplan
          terraform show -json destroy.tfplan > destroy.json

      - name: Request approval for destroy
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: ${{ github.actor }}
          minimum-approvals: 1
          issue-title: "Approval needed for Terraform destroy in ${{ needs.determine-environment.outputs.environment }} environment"
          issue-body: "Please approve the infrastructure destruction in the ${{ needs.determine-environment.outputs.environment }} environment by adding a comment with 'approve' in this issue."
          exclude-workflow-initiator-as-approver: false
          timeout-minutes: 10

      - name: Terraform Destroy
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          cd terraform/environments/$ENVIRONMENT
          terraform apply -auto-approve destroy.tfplan