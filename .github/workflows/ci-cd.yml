name: Development Pipeline

on:
  push:
    branches: [ development ]
    paths:
      - 'app/**'
      - 'terraform/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'setup.py'
      - '.github/workflows/ci-cd.yml'
      - 'lambda_handler.py'
      - 'create_lambda_package.sh'
  workflow_dispatch:
    inputs:
      run_infrastructure:
        description: 'Run Terraform Infrastructure'
        required: true
        default: true
        type: boolean
      run_tests:
        description: 'Run Tests'
        required: true
        default: true
        type: boolean
      build_and_deploy:
        description: 'Build and Deploy'
        required: true
        default: true
        type: boolean
      destroy_infrastructure:
        description: 'Destroy Infrastructure'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Check for file changes
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            terraform:
              - 'terraform/**'
            app:
              - 'app/**'
              - 'Dockerfile'
              - 'requirements.txt'
              - 'setup.py'
              - 'lambda_handler.py'
              - 'create_lambda_package.sh'

  build-lambda-package:
    name: Build Lambda Package
    needs: [changes]
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_and_deploy == 'true' && github.event.inputs.destroy_infrastructure == 'false') || (github.event_name != 'workflow_dispatch' && needs.changes.outputs.app == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      lambda_package_path: ${{ steps.create-lambda-package.outputs.lambda_package_path }}
      s3_lambda_key: ${{ steps.upload-lambda.outputs.s3_lambda_key }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Update script permissions
        run: chmod +x create_lambda_package.sh

      - name: Verify script content
        run: |
          echo "Checking script content:"
          head -20 create_lambda_package.sh
          echo "..."
          tail -5 create_lambda_package.sh

      - name: Create Lambda deployment package
        id: create-lambda-package
        run: |
          ./create_lambda_package.sh
          echo "lambda_package_path=lambda_deployment_package.zip" >> $GITHUB_OUTPUT
          # Verify the zip file is not empty
          if [ ! -s lambda_deployment_package.zip ]; then
            echo "ERROR: Lambda deployment package is empty!"
            exit 1
          fi
          echo "ZIP file details:"
          ls -la lambda_deployment_package.zip
          echo "ZIP contents (first 10 files):"
          unzip -l lambda_deployment_package.zip | head -10

      - name: Configure AWS credentials with Role
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::070503547773:role/GitHubActionsRole
          aws-region: us-east-1

      - name: Upload Lambda package to S3
        id: upload-lambda
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          S3_KEY="lambda/lambda_deployment_package_${TIMESTAMP}.zip"
          S3_BUCKET="terraform-state-${{ github.repository_owner }}-${{ github.event.repository.name }}"
          
          # Ensure bucket exists
          if ! aws s3api head-bucket --bucket $S3_BUCKET 2>/dev/null; then
            echo "Creating S3 bucket for Lambda packages"
            aws s3api create-bucket --bucket $S3_BUCKET --region us-east-1
          fi
          
          # Upload to S3
          aws s3 cp lambda_deployment_package.zip s3://$S3_BUCKET/$S3_KEY
          
          # Verify upload
          if aws s3 ls s3://$S3_BUCKET/$S3_KEY; then
            echo "Lambda package uploaded successfully to s3://$S3_BUCKET/$S3_KEY"
            echo "s3_lambda_key=$S3_KEY" >> $GITHUB_OUTPUT
            echo "s3_bucket=$S3_BUCKET" >> $GITHUB_OUTPUT
          else
            echo "Failed to upload Lambda package to S3"
            exit 1
          fi
          
      - name: Upload Lambda package artifact (for reference)
        uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: lambda_deployment_package.zip
          retention-days: 5

  terraform-dev:
    name: Terraform Dev Infrastructure
    needs: changes
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.run_infrastructure == 'true' && github.event.inputs.destroy_infrastructure == 'false') || (github.event_name != 'workflow_dispatch' && needs.changes.outputs.terraform == 'true') }}
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      db_host: ${{ steps.outputs.outputs.db_host }}
      db_name: ${{ steps.outputs.outputs.db_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials with Role
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::070503547773:role/GitHubActionsRole
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Check for S3 state bucket
        id: check_s3_bucket
        run: |
          BUCKET_NAME="terraform-state-${{ github.repository_owner }}-${{ github.event.repository.name }}"
          BUCKET_EXISTS=$(aws s3api head-bucket --bucket $BUCKET_NAME 2>&1 || echo "not exists")
          if [[ $BUCKET_EXISTS == *"not exists"* ]]; then
            echo "create_bucket=true" >> $GITHUB_OUTPUT
            echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          else
            echo "create_bucket=false" >> $GITHUB_OUTPUT
            echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Create S3 state bucket if not exists
        if: steps.check_s3_bucket.outputs.create_bucket == 'true'
        run: |
          aws s3api create-bucket --bucket ${{ steps.check_s3_bucket.outputs.bucket_name }} --region us-east-1
          aws s3api put-bucket-versioning --bucket ${{ steps.check_s3_bucket.outputs.bucket_name }} --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption --bucket ${{ steps.check_s3_bucket.outputs.bucket_name }} --server-side-encryption-configuration '{"Rules": [{"ApplyServerSideEncryptionByDefault": {"SSEAlgorithm": "AES256"}}]}'

      - name: Update backend configuration
        run: |
          cat <<EOF > terraform/environments/dev/backend.tf
          terraform {
            backend "s3" {
              bucket = "${{ steps.check_s3_bucket.outputs.bucket_name }}"
              key    = "terraform/dev/terraform.tfstate"
              region = "us-east-1"
            }
          }
          EOF

      - name: Create valid placeholder Lambda ZIP
        run: |
          echo "Creating valid placeholder Lambda ZIP for initial deployment"
          mkdir -p placeholder_lambda
          echo '
          def lambda_handler(event, context):
              return {
                  "statusCode": 200,
                  "body": "Placeholder Lambda function"
              }
          ' > placeholder_lambda/lambda_handler.py
          cd placeholder_lambda
          zip -r ../lambda_deployment_package.zip .
          cd ..
          
          # Verify the placeholder zip
          ls -la lambda_deployment_package.zip
          unzip -l lambda_deployment_package.zip

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: terraform init

      - name: Terraform Format
        working-directory: terraform/environments/dev
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: terraform/environments/dev
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform/environments/dev
        id: plan
        run: |
          terraform plan -var-file=../../config/dev.tfvars -var="lambda_zip_path=../../../lambda_deployment_package.zip" -out=tfplan
          terraform show -json tfplan > plan.json

      - name: Store Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-plan
          path: terraform/environments/dev/plan.json
          retention-days: 5

      - name: Terraform Apply
        working-directory: terraform/environments/dev
        run: terraform apply -auto-approve tfplan
        
      - name: Get Terraform Outputs
        id: outputs
        working-directory: terraform/environments/dev
        run: |
          # First, check what outputs are actually available
          echo "Available Terraform outputs:"
          terraform output
          
          # Try to get the RDS endpoint with error handling
          if terraform output | grep -q "rds_endpoint"; then
            DB_HOST=$(terraform output -raw rds_endpoint 2>/dev/null | tr -d '\n')
          else
            echo "Warning: rds_endpoint output not found, using empty value"
            DB_HOST=""
          fi
          
          # Try to get the DB name with error handling
          if terraform output | grep -q "db_name"; then
            DB_NAME=$(terraform output -raw db_name 2>/dev/null | tr -d '\n')
          else
            echo "Warning: db_name output not found, using empty value"
            DB_NAME=""
          fi
          
          # Debug what values we found
          echo "Found DB_HOST=${DB_HOST}"
          echo "Found DB_NAME=${DB_NAME}"
          
          # Set outputs with proper handling
          echo "db_host=${DB_HOST}" >> $GITHUB_OUTPUT
          echo "db_name=${DB_NAME}" >> $GITHUB_OUTPUT

  terraform-with-lambda:
    name: Apply Terraform with Lambda Package
    needs: [terraform-dev, build-lambda-package]
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_and_deploy == 'true' && github.event.inputs.destroy_infrastructure == 'false') || (github.event_name != 'workflow_dispatch' && needs.changes.outputs.app == 'true') }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials with Role
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::070503547773:role/GitHubActionsRole
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Create Lambda S3 variables file
        run: |
          S3_BUCKET="terraform-state-${{ github.repository_owner }}-${{ github.event.repository.name }}"
          S3_KEY="${{ needs.build-lambda-package.outputs.s3_lambda_key }}"
          
          echo "Creating Lambda S3 variables file with:"
          echo "Bucket: $S3_BUCKET"
          echo "Key: $S3_KEY"
          
          mkdir -p terraform/environments/dev
          cat > terraform/environments/dev/lambda_vars.auto.tfvars <<EOF
          use_s3_source = true
          s3_bucket = "$S3_BUCKET"
          s3_key = "$S3_KEY"
          EOF

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: terraform init

      - name: Verify Lambda S3 variables file
        run: |
          echo "Contents of lambda_vars.auto.tfvars:"
          cat terraform/environments/dev/lambda_vars.auto.tfvars

      - name: Terraform Apply with Lambda package
        working-directory: terraform/environments/dev
        run: |
          terraform apply -auto-approve \
            -var-file=../../config/dev.tfvars \
            -var="use_s3_source=true" \
            -var="s3_bucket=terraform-state-bmoldo-devops-home-task" \
            -var="s3_key=lambda/lambda_deployment_package_${TIMESTAMP}.zip"

  test-app:
    name: Test Application
    needs: [terraform-with-lambda]
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.run_tests == 'true' && github.event.inputs.destroy_infrastructure == 'false') || (github.event_name != 'workflow_dispatch' && needs.changes.outputs.app == 'true') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: users
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::070503547773:role/GitHubActionsRole
          aws-region: us-east-1

      - name: Get database credentials from Secrets Manager
        id: get-db-creds
        run: |
          SECRET_VALUE=$(aws secretsmanager get-secret-value --secret-id arn:aws:secretsmanager:us-east-1:070503547773:secret:user-api-db-dev-credentials-fIuI0q --query SecretString --output text)
          echo "DB_HOST=$(echo $SECRET_VALUE | jq -r '.host')" >> $GITHUB_OUTPUT
          echo "DB_USER=$(echo $SECRET_VALUE | jq -r '.username')" >> $GITHUB_OUTPUT
          echo "DB_PASS=$(echo $SECRET_VALUE | jq -r '.password')" >> $GITHUB_OUTPUT
          echo "DB_NAME=$(echo $SECRET_VALUE | jq -r '.dbname')" >> $GITHUB_OUTPUT
          echo "DB_PORT=$(echo $SECRET_VALUE | jq -r '.port')" >> $GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov jq

      - name: Update init-db.sh permissions
        run: chmod +x init-db.sh

      - name: Initialize test database
        env:
          POSTGRES_USER: ${{ steps.get-db-creds.outputs.DB_USER }}
          POSTGRES_DB: ${{ steps.get-db-creds.outputs.DB_NAME }}
          PGPASSWORD: ${{ steps.get-db-creds.outputs.DB_PASS }}
          PGHOST: localhost
          PGPORT: 5432
        run: ./init-db.sh

      - name: Run Lambda tests
        env:
          DATABASE_URL: postgresql://${{ steps.get-db-creds.outputs.DB_USER }}:${{ steps.get-db-creds.outputs.DB_PASS }}@${{ steps.get-db-creds.outputs.DB_HOST }}:${{ steps.get-db-creds.outputs.DB_PORT }}/${{ steps.get-db-creds.outputs.DB_NAME }}_test
          ENVIRONMENT: dev
          AWS_DEFAULT_REGION: us-east-1
          S3_BUCKET_NAME: user-queries-dev
          PYTEST_CURRENT_TEST: "True"
          AWS_LAMBDA_FUNCTION_NAME: user-api-dev
          AWS_REGION: us-east-1
          AWS_EXECUTION_ENV: AWS_Lambda_python3.11
        run: pytest --cov=app tests/test_lambda.py -v

      - name: Upload test coverage report
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-report
          path: .coverage
          retention-days: 5

  terraform-destroy:
    name: Terraform Destroy Dev Infrastructure
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.destroy_infrastructure == 'true'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials with Role
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::070503547773:role/GitHubActionsRole
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Create S3 backend configuration
        run: |
          BUCKET_NAME="terraform-state-${{ github.repository_owner }}-${{ github.event.repository.name }}"
          cat <<EOF > terraform/environments/dev/backend.tf
          terraform {
            backend "s3" {
              bucket = "$BUCKET_NAME"
              key    = "terraform/dev/terraform.tfstate"
              region = "us-east-1"
            }
          }
          EOF

      - name: Create placeholder zip for destroy
        run: |
          echo "Creating placeholder Lambda ZIP for destroy operation"
          mkdir -p placeholder
          echo "placeholder" > placeholder/placeholder.txt
          cd placeholder
          zip -r ../lambda_deployment_package.zip .
          cd ..
          ls -la lambda_deployment_package.zip

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: terraform init

      - name: Terraform Destroy Plan
        working-directory: terraform/environments/dev
        id: destroy-plan
        run: |
          terraform plan -destroy -var-file=../../config/dev.tfvars -var="lambda_zip_path=../../../lambda_deployment_package.zip" -out=destroy.tfplan
          terraform show -json destroy.tfplan > destroy.json

      - name: Request approval for destroy
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: ${{ github.actor }}
          minimum-approvals: 1
          issue-title: "Approval needed for Terraform destroy in dev environment"
          issue-body: "Please approve the infrastructure destruction in the dev environment by adding a comment with 'approve' in this issue."
          exclude-workflow-initiator-as-approver: false
          timeout-minutes: 10

      - name: Store Destroy Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-destroy-plan
          path: terraform/environments/dev/destroy.json
          retention-days: 5

      - name: Terraform Destroy
        working-directory: terraform/environments/dev
        run: terraform apply -auto-approve destroy.tfplan

      - name: Notify Destroy Completion
        run: |
          echo "Terraform destroy completed successfully!"
          echo "All resources in the dev environment have been destroyed."