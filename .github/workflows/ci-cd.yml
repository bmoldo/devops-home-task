name: Infrastructure Pipeline

on:
  push:
    branches: [ development ]
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - 'docker-compose.yml'
      - 'app/**'
      - 'terraform/**'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    # PRs for QA (from development) and PROD (from qa)
    branches: [ qa, prod ]
    types: [ opened, synchronize, reopened, closed ]
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - 'docker-compose.yml'
      - 'app/**'
      - 'terraform/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - prod
      run_infrastructure:
        description: 'Run Terraform Infrastructure'
        required: true
        default: true
        type: boolean
      run_tests:
        description: 'Run Tests'
        required: true
        default: true
        type: boolean
      build_and_deploy:
        description: 'Build and Deploy'
        required: true
        default: true
        type: boolean
      destroy_infrastructure:
        description: 'Destroy Infrastructure'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  determine-environment:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      tfvars_file: ${{ steps.set-env.outputs.tfvars_file }}
    steps:
      - name: Set environment based on branch/PR or input
        id: set-env
        run: |
            ENVIRONMENT="dev"
            TFVARS_FILE="terraform/config/dev.tfvars"
        
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
                if [[ "${{ github.event.inputs.environment }}" == "development" || "${{ github.event.inputs.environment }}" == "dev" ]]; then
                ENVIRONMENT="dev"
                TFVARS_FILE="terraform/config/dev.tfvars"
                else
                ENVIRONMENT="${{ github.event.inputs.environment }}"
                TFVARS_FILE="terraform/config/${ENVIRONMENT}.tfvars"
                fi
            elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
                if [[ "${{ github.base_ref }}" == "qa" ]]; then
                ENVIRONMENT="qa"
                TFVARS_FILE="terraform/config/qa.tfvars"
                elif [[ "${{ github.base_ref }}" == "prod" ]]; then
                ENVIRONMENT="prod"
                TFVARS_FILE="terraform/config/prod.tfvars"
                fi
            elif [[ "${{ github.event_name }}" == "push" ]]; then
                if [[ "${{ github.ref }}" == "refs/heads/development" ]]; then
                ENVIRONMENT="dev"
                TFVARS_FILE="terraform/config/dev.tfvars"
                fi
            fi
        
            echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
            echo "tfvars_file=$TFVARS_FILE" >> $GITHUB_OUTPUT
            echo "Selected environment: $ENVIRONMENT"
            echo "Selected tfvars file: $TFVARS_FILE"

      - name: Configure AWS credentials with Role
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::070503547773:role/GitHubActionsRole
          aws-region: us-east-1

  changes:
    name: Detect File Changes
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      lambda: ${{ steps.filter.outputs.lambda }}
    steps:
      - name: Checkout development branch if push, else default
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref == 'refs/heads/development' && 'development' || '' }}
          fetch-depth: 0

      - name: Check for file changes
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            terraform:
              - 'terraform/**'
              - '.github/workflows/ci-cd.yml'
            lambda:
              - 'Dockerfile'
              - 'requirements.txt'
              - 'docker-compose.yml'
              - 'app/**'
            bootstrap:
              - 'terraform/bootstrap/**'

  bootstrap-lock-table:
    name: Bootstrap Lock Table
    runs-on: ubuntu-latest
    needs: [determine-environment, changes]
    if: |
      needs.changes.outputs.terraform == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::070503547773:role/GitHubActionsRole
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Bootstrap DynamoDB Lock Table
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          cd terraform/bootstrap
          terraform init
          terraform apply -auto-approve -var="environment=$ENVIRONMENT"


  terraform-plan:
    name: Terraform Plan
    needs: [determine-environment, changes]
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_infrastructure == 'true' && github.event.inputs.destroy_infrastructure == 'false') ||
      (
        github.event_name != 'workflow_dispatch' &&
        needs.changes.outputs.terraform == 'true' &&
        (
          (github.event_name == 'push' && github.ref == 'refs/heads/development') ||
          (github.event_name == 'pull_request' && ((github.base_ref == 'qa' && github.head_ref == 'development') || (github.base_ref == 'prod' && github.head_ref == 'qa')))
        )
      )
    runs-on: ubuntu-20.04
    environment: ${{ needs.determine-environment.outputs.environment }}
    steps:

      - name: Configure AWS credentials with Role
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::070503547773:role/GitHubActionsRole
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Check for S3 state bucket
        id: check_s3_bucket
        run: |
          BUCKET_NAME="terraform-state-${{ github.repository_owner }}-${{ github.event.repository.name }}"
          BUCKET_EXISTS=$(aws s3api head-bucket --bucket $BUCKET_NAME 2>&1 || echo "not exists")
          if [[ $BUCKET_EXISTS == *"not exists"* ]]; then
            echo "create_bucket=true" >> $GITHUB_OUTPUT
            echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          else
            echo "create_bucket=false" >> $GITHUB_OUTPUT
            echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Update backend configuration
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          mkdir -p terraform/environments/$ENVIRONMENT
          cat <<EOF > terraform/environments/$ENVIRONMENT/backend.tf
          terraform {
            backend "s3" {
              bucket = "${{ steps.check_s3_bucket.outputs.bucket_name }}"
              key    = "terraform/$ENVIRONMENT/terraform.tfstate"
              region = "us-east-1"
              dynamodb_table = "terraform-locks-$ENVIRONMENT"
            }
          }
          EOF
      - name: Checkout development branch if push, else default
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref == 'refs/heads/development' && 'development' || '' }}
          fetch-depth: 0

      - name: Terraform Init
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          cd terraform/environments/$ENVIRONMENT
          terraform init -reconfigure

      # - name: Terraform Format
      #   run: |
      #     ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
      #     cd terraform
      #     terraform fmt -check -recursive

      - name: Terraform Validate
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          cd terraform/environments/$ENVIRONMENT
          terraform validate

      - name: Terraform Plan
        id: plan
        run: |
            ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
            TFVARS_FILE="${{ needs.determine-environment.outputs.tfvars_file }}"
            cd terraform/environments/$ENVIRONMENT
            terraform plan -var-file=../../config/$ENVIRONMENT.tfvars -out=tfplan
            terraform show -json tfplan > plan.json

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-${{ needs.determine-environment.outputs.environment }}-plan
          path: terraform/environments/${{ needs.determine-environment.outputs.environment }}/plan.json
          retention-days: 5

      - name: Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const environment = '${{ needs.determine-environment.outputs.environment }}';
            const planSummary = fs.readFileSync('terraform/environments/' + environment + '/tfplan', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan for ${environment} environment\n\n` +
                    `\`\`\`\n${planSummary}\n\`\`\``
            });

  build-lambda-package:
    name: Build Lambda Package
    needs: [determine-environment, terraform-plan]
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_and_deploy == 'true' && github.event.inputs.destroy_infrastructure == 'false') ||
      (
        github.event_name != 'workflow_dispatch' &&
        needs.changes.outputs.lambda == 'true' &&
        (
          (github.event_name == 'push' && github.ref == 'refs/heads/development') ||
          (github.event_name == 'pull_request' && ((github.base_ref == 'qa' && github.head_ref == 'development') || (github.base_ref == 'prod' && github.head_ref == 'qa')))
        )
      )
    runs-on: ubuntu-latest
    outputs:
      lambda_package_path: ${{ steps.create-lambda-package.outputs.lambda_package_path }}
      s3_lambda_key: ${{ steps.upload-lambda.outputs.s3_lambda_key }}
    steps:
      - name: Checkout development branch if push, else default
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref == 'refs/heads/development' && 'development' || '' }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      # - name: Run Python security scan (Bandit)
      #   id: bandit-scan
      #   run: |
      #     echo "🔐 Scanning Python files in ./app/ for security issues..."
      #     pip install bandit
      #     bandit -r ./app -f json -o bandit_report.json || true
      #     cat bandit_report.json

      #     ISSUE_COUNT=$(jq '.results | length' bandit_report.json)
      #     echo "🚨 Issues found: $ISSUE_COUNT"

      #     if [ "$ISSUE_COUNT" -gt 0 ]; then
      #       echo "scan_passed=false" >> $GITHUB_OUTPUT
      #       echo "❌ Security issues detected in Python code."
      #     else
      #       echo "scan_passed=true" >> $GITHUB_OUTPUT
      #       echo "✅ No security issues found."
      #     fi

      - name: Update script permissions
        run: chmod +x create_lambda_package.sh

      - name: Create Lambda deployment package
        id: create-lambda-package
        # if: steps.bandit-scan.outputs.scan_passed == 'true'
        run: |
          ./create_lambda_package.sh
          echo "lambda_package_path=lambda_deployment_package.zip" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials with Role
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::070503547773:role/GitHubActionsRole
          aws-region: us-east-1

      - name: Upload Lambda package to S3
        id: upload-lambda
        # if: steps.bandit-scan.outputs.scan_passed == 'true'
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          ACCOUNT_ID="070503547773"
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          S3_KEY="lambda/lambda_deployment_package_${TIMESTAMP}.zip"
          S3_BUCKET="lambda-packages-${ENVIRONMENT}-${ACCOUNT_ID}"
          if ! aws s3api head-bucket --bucket $S3_BUCKET 2>/dev/null; then
            echo "Error: Lambda zip bucket doesn't exist. Infrastructure may not be deployed yet."
            exit 1
          fi
          aws s3 cp lambda_deployment_package.zip s3://$S3_BUCKET/$S3_KEY
          if aws s3 ls s3://$S3_BUCKET/$S3_KEY; then
            echo "Lambda package uploaded successfully to s3://$S3_BUCKET/$S3_KEY"
            echo "s3_lambda_key=$S3_KEY" >> $GITHUB_OUTPUT
          else
            echo "Failed to upload Lambda package to S3"
            exit 1
          fi

  terraform-apply:
    name: Terraform Apply Infrastructure
    needs: [determine-environment, terraform-plan, build-lambda-package]
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_infrastructure == 'true') ||
      (
        github.event_name != 'workflow_dispatch' &&
        needs.changes.outputs.terraform == 'true' &&
        (
          (github.event_name == 'push' && github.ref == 'refs/heads/development') ||
          (github.event_name == 'pull_request' && ((github.base_ref == 'qa' && github.head_ref == 'development') || (github.base_ref == 'prod' && github.head_ref == 'qa')))
        )
      )
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-environment.outputs.environment }}
    outputs:
      db_host: ${{ steps.outputs.outputs.db_host }}
      db_name: ${{ steps.outputs.outputs.db_name }}
    steps:
      - name: Checkout development branch if push, else default
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref == 'refs/heads/development' && 'development' || '' }}
          fetch-depth: 0

      - name: Configure AWS credentials with Role
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::070503547773:role/GitHubActionsRole
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Check for S3 state bucket
        id: check_s3_bucket
        run: |
          BUCKET_NAME="terraform-state-${{ github.repository_owner }}-${{ github.event.repository.name }}"
          BUCKET_EXISTS=$(aws s3api head-bucket --bucket $BUCKET_NAME 2>&1 || echo "not exists")
          if [[ $BUCKET_EXISTS == *"not exists"* ]]; then
            echo "create_bucket=true" >> $GITHUB_OUTPUT
            echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          else
            echo "create_bucket=false" >> $GITHUB_OUTPUT
            echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Create valid placeholder Lambda ZIP
        run: |
          echo "Creating valid placeholder Lambda ZIP for deployment"
          mkdir -p placeholder_lambda
          echo 'def lambda_handler(event, context): return {"statusCode": 200, "body": "Placeholder Lambda function"}' > placeholder_lambda/lambda_handler.py
          cd placeholder_lambda
          zip -r ../lambda_deployment_package.zip .
          cd ..

      - name: Update backend configuration
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          mkdir -p terraform/environments/$ENVIRONMENT
          cat <<EOF > terraform/environments/$ENVIRONMENT/backend.tf
          terraform {
            backend "s3" {
              bucket = "${{ steps.check_s3_bucket.outputs.bucket_name }}"
              key    = "terraform/$ENVIRONMENT/terraform.tfstate"
              region = "us-east-1"
            }
            }
          EOF

      - name: Terraform Init
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          cd terraform/environments/$ENVIRONMENT
       
          terraform init
      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-${{ needs.determine-environment.outputs.environment }}-plan
    
          path: terraform/environments/${{ needs.determine-environment.outputs.environment }}/

      # - name: Terraform Apply
      #   run: |
      #     ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
      #     TFVARS_FILE="../../config/${ENVIRONMENT}.tfvars"
      #     S3_BUCKET="lambda-packages-${ENVIRONMENT}-070503547773"
      #     S3_KEY="${{ needs.build-lambda-package.outputs.s3_lambda_key }}"
          
      #     cd terraform/environments/$ENVIRONMENT
      
      #     terraform apply -auto-approve \
      #       -var-file=$TFVARS_FILE \
      #       -var="enabled=true" \
      #       -var="s3_bucket=$S3_BUCKET" \
      #       -var="s3_key=$S3_KEY"
        
      - name: Terraform Apply
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          TFVARS_FILE="../../config/${ENVIRONMENT}.tfvars"
          S3_BUCKET="lambda-packages-${ENVIRONMENT}-070503547773"
          S3_KEY="${{ needs.build-lambda-package.outputs.s3_lambda_key }}"
          
          if [ -z "$S3_KEY" ]; then
            echo "❌ ERROR: S3 key is not available. Lambda package likely failed to build or upload."
            exit 1
          fi
      
          echo "✅ Using Lambda S3 key: $S3_KEY"
      
          cd terraform/environments/$ENVIRONMENT
      
          terraform apply -auto-approve \
            -var-file=$TFVARS_FILE \
            -var="enabled=true" \
            -var="s3_bucket=$S3_BUCKET" \
            -var="s3_key=$S3_KEY"
    

      - name: Get Terraform Outputs
        id: outputs
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          cd terraform/environments/$ENVIRONMENT
          terraform output > terraform_outputs.txt
          if grep -q "rds_endpoint" terraform_outputs.txt; then
            DB_HOST=$(terraform output -raw rds_endpoint 2>/dev/null | tr -d '\n')
          else
            echo "Warning: rds_endpoint output not found, using empty value"
            DB_HOST=""
          fi
          if grep -q "db_name" terraform_outputs.txt; then
            DB_NAME=$(terraform output -raw db_name 2>/dev/null | tr -d '\n')
          else
            echo "Warning: db_name output not found, using empty value"
            DB_NAME=""
          fi
          echo "db_host=${DB_HOST}" >> $GITHUB_OUTPUT
          echo "db_name=${DB_NAME}" >> $GITHUB_OUTPUT

  healthcheck:
    name: API Healthcheck
    needs: [determine-environment, terraform-apply]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::070503547773:role/GitHubActionsRole
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Run API Healthcheck
        run: |
          set -euo pipefail
          echo "🔍 Running Healthcheck..."
      
          ENV="${{ needs.determine-environment.outputs.environment }}"
          echo "📦 ENV: $ENV"
      
          cd terraform/environments/$ENV
      
          echo "🔧 Initializing Terraform..."
          terraform init -reconfigure > /dev/null
      
          # Create a temporary script to get the API URL
          cat > get_url.sh << 'EOF'
          #!/bin/bash
          terraform output -raw api_url
          EOF
      
          chmod +x get_url.sh
          API_URL=$(./get_url.sh)
      
          if [[ -z "$API_URL" ]]; then
            echo "❌ No 'api_url' found in Terraform outputs."
            echo "ℹ️ Available outputs:"
            terraform output || true
            exit 1
          fi
      
          # Ensure the URL is properly formed
          HEALTHCHECK_URL="${API_URL}/healthcheck"
          echo "ℹ️ Using API URL: $API_URL"
          echo "🔁 Sending GET request to $HEALTHCHECK_URL..."
      
          # Use the actual curl command directly on the URL
          curl --fail --silent --show-error "$HEALTHCHECK_URL" || {
            echo "❌ Healthcheck failed at $HEALTHCHECK_URL"
            exit 1
          }
      
          echo "✅ Healthcheck passed: $HEALTHCHECK_URL"
      

  terraform-destroy:
    name: Terraform Destroy Infrastructure
    needs: [determine-environment]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.destroy_infrastructure == true
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-environment.outputs.environment }}
    steps:
      - name: Checkout development branch if push, else default
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref == 'refs/heads/development' && 'development' || '' }}
          fetch-depth: 0

      - name: Configure AWS credentials with Role
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::070503547773:role/GitHubActionsRole
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Create placeholder zip for destroy
        run: |
          echo "Creating placeholder Lambda ZIP for destroy operation"
          mkdir -p placeholder
          echo "placeholder" > placeholder/placeholder.txt
          cd placeholder
          zip -r ../lambda_deployment_package.zip .
          cd ..

      - name: Check for S3 state bucket
        id: check_s3_bucket
        run: |
          BUCKET_NAME="terraform-state-${{ github.repository_owner }}-${{ github.event.repository.name }}"
          BUCKET_EXISTS=$(aws s3api head-bucket --bucket $BUCKET_NAME 2>&1 || echo "not exists")
          if [[ $BUCKET_EXISTS == *"not exists"* ]]; then
            echo "create_bucket=true" >> $GITHUB_OUTPUT
            echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          else
            echo "create_bucket=false" >> $GITHUB_OUTPUT
            echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Update backend configuration
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          mkdir -p terraform/environments/$ENVIRONMENT
          cat <<EOF > terraform/environments/$ENVIRONMENT/backend.tf
          terraform {
            backend "s3" {
              bucket = "${{ steps.check_s3_bucket.outputs.bucket_name }}"
              key    = "terraform/$ENVIRONMENT/terraform.tfstate"
              region = "us-east-1"
            }
          }
          EOF

      - name: Terraform Init
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          cd terraform/environments/$ENVIRONMENT
          terraform init

      - name: Terraform Destroy
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          TFVARS_FILE="${{ needs.determine-environment.outputs.tfvars_file }}"
          cd terraform/environments/$ENVIRONMENT
          terraform destroy -auto-approve -var-file=$TFVARS_FILE 